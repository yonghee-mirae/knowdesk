[package]
name = "knowdesk-core"
version.workspace = true
edition.workspace = true

[lib]
name = "knowdesk_core"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
walkdir = "2"
encoding_rs = "0.8"
chardetng = "0.1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
calamine = "0.36"
zip = "8"
quick-xml = "0.41"
pdfium-render = "0.9"
kiwi-rs = "2026.7.24"
notify = "8.2"

[dev-dependencies]
tempfile = "3"
rust_xlsxwriter = "0.98"
