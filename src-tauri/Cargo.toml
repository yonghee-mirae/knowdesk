[package]
name = "knowdesk-tauri"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: required for a real transparent window on macOS - without it,
# `transparent: true` only makes the NSWindow non-opaque while WKWebView still paints
# its own opaque background, so CSS `border-radius` corners show as solid white/black
# instead of see-through (`tauri.conf.json`'s `macOSPrivateApi` enables it at runtime).
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
knowdesk-core = { path = "../core" }
# App-data directory resolution for the index DB path (docs/03_Architecture.md: OS
# integration lives in src-tauri, never in `core`).
dirs = "6"

[dev-dependencies]
tempfile = "3"
