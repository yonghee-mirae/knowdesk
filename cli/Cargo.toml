[package]
name = "knowdesk-cli"
version.workspace = true
edition.workspace = true

[lib]
name = "knowdesk_cli"
path = "src/lib.rs"

[[bin]]
name = "cli"
path = "src/main.rs"

# `kdfind` - a standalone, no-pre-built-index search tool (`docs/13_CLI_Tool.md`).
# Distributed separately from `cli`, hence its own `settings_cli.json` instead of
# reading `KNOWDESK_*` environment variables.
[[bin]]
name = "kdfind"
path = "src/bin/find.rs"

[dependencies]
knowdesk-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
