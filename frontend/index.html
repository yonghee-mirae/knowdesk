<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KnowDesk</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
  </head>
  <body>
    <div id="app">
      <kd-search-bar></kd-search-bar>
      <div class="kd-index-progress" id="index-progress" hidden></div>
      <div class="kd-body single-pane" id="body">
        <kd-result-list hidden></kd-result-list>
        <kd-syntax-help></kd-syntax-help>
        <kd-preview hidden></kd-preview>
      </div>
      <footer class="kd-footer">
        <span><kbd>↑</kbd><kbd>↓</kbd> 이동</span>
        <span><kbd>Enter</kbd> 열기</span>
        <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 폴더 열기</span>
        <span><kbd>Ctrl</kbd>+<kbd>C</kbd> 경로 복사</span>
        <span><kbd>Esc</kbd> 닫기</span>
        <span class="kd-footer-right" id="morph-status" hidden title="형태소 분석 활성">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
        </span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
