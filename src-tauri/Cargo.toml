[package]
name = "knowdesk-tauri"
version.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# macos-private-api: required for a real transparent window on macOS - without it,
# `transparent: true` only makes the NSWindow non-opaque while WKWebView still paints
# its own opaque background, so CSS `border-radius` corners show as solid white/black
# instead of see-through (`tauri.conf.json`'s `macOSPrivateApi` enables it at runtime).
# tray-icon: tray icon + menu (TASK-801). image-png: decodes the tray's PNG
# icon at runtime via `Image::from_bytes`.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Global hotkey to reveal the search window from anywhere (TASK-802).
tauri-plugin-global-shortcut = "2"
# Prevents a second process from starting - a duplicate launch just shows/focuses
# the already-running instance's search window instead.
tauri-plugin-single-instance = "2"
# Confirmation dialog for "Reset Index" (tray menu action) - only its non-blocking
# `.show(callback)` API is used, never a `blocking_*` one, so this can't reproduce
# the TASK-704 `blocking_pick_folder()` deadlock that got the picker removed.
tauri-plugin-dialog = "2"
# "Launch at login" (`Config.auto_start`) - registers/unregisters a login item
# via the OS-native mechanism (macOS LaunchAgent, Windows registry Run key,
# Linux XDG autostart .desktop file).
tauri-plugin-autostart = "2"
knowdesk-core = { path = "../core" }

# `NSApplication.activateIgnoringOtherApps` (`activate_app()`) - already in the
# dependency graph transitively via `tauri`, pinned here to call it directly.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder"] }

[dev-dependencies]
tempfile = "3"
